services:
  postgres:
    image: postgres:17
    container_name: birdlog-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-birdlog}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
