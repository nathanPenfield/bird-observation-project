services:
  postgres:
    image: postgres:17
    container_name: birdlog-postgres
    environment:
      POSTGRES_DB: birdlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: birdsAreCool!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
